# Caveats-exercising bundle for patch_bundle_yaml.py.
#
# Deliberately reproduces every footgun listed in the README's
# "Caveats worth flagging to bundle owners" section, so you can dry-run
# the patcher and inspect the resulting diff against a real-world-shaped
# bundle.
#
# Caveats reproduced:
#   1. Templated webhook IDs        -> resources/reporting.yml
#   2. Anchors and `<<:` merges     -> resources/etl.yml
#   3. Per-target overrides         -> targets.prod.resources.jobs.analytics_job below
#
# Suggested commands:
#   # Dry-run — patches base resources only; per-target overrides are detected
#   # and INFO-logged. DAB merge will fan the base webhook out to every target
#   # at deploy time without duplicates.
#   python3 patch_bundle_yaml.py --bundle-dir examples/caveats --webhook-id WID
#
bundle:
  name: caveats-bundle

variables:
  webhook_id:
    description: |
      Notification destination ID indirected via a bundle variable. The
      patcher writes LITERAL IDs and treats this reference as an opaque
      string, so running with --webhook-id <literal> against a job that
      already references ${var.webhook_id} produces a DUPLICATE entry —
      both the variable-resolved ID and the literal ID will receive POSTs.
    default: "4c6145d0-1fbe-4ae0-b019-6f621361a04c"

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/riyazali.mohammad@databricks.com/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        # Caveat: per-target override has its OWN webhook_notifications.
        # The patcher never writes to target overrides — DAB deep-merge
        # CONCATENATES webhook_notifications event lists at deploy time, so
        # patching the base is enough to propagate the webhook into prod.
        # In prod this override's `prod-only` destination survives alongside
        # the base's patched webhook (concat yields both, no duplicates).
        # If the override ever contained the same ID the patcher writes to
        # base, the resulting concat would duplicate and Databricks would
        # reject the deploy — the patcher logs a WARNING in that case.
        analytics_job:
          name: analytics-prod
          webhook_notifications:
            on_failure:
              - id: d456b7c3-7af9-4e55-985e-b4a41fc2465a
          timeout_seconds: 7200
