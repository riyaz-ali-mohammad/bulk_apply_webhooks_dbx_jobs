# Caveat: anchors and `<<:` merges. Three jobs share configuration via a
# YAML anchor (`&defaults`) declared on the first job. The patcher walks
# `resources.jobs.<name>` directly and writes `webhook_notifications` into
# EACH consumer job, producing 3x the diff lines. The cleaner shape is to
# put the webhook block on the anchor itself (manual edit); the patcher
# can't do that safely because the anchor target might be used by
# non-job resources too.
resources:
  jobs:
    # Anchor target — also a real deployable job.
    extract_job: &defaults
      name: extract
      tags:
        team: data-platform
        cohort: webhook-rollout-1
      email_notifications:
        on_failure:
          - alerts@example.com
      timeout_seconds: 3600
      tasks:
        - task_key: extract
          notebook_task:
            notebook_path: ../notebooks/common.py

    # Consumers — inherit tags, email_notifications, timeout via `<<: *defaults`
    # and override name + tasks.
    transform_job:
      <<: *defaults
      name: transform
      tasks:
        - task_key: transform
          notebook_task:
            notebook_path: ../notebooks/common.py

    load_job:
      <<: *defaults
      name: load
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: ../notebooks/common.py
