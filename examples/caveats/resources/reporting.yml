# Caveat: templated webhook IDs (`${var.webhook_id}`). This job already
# wires up a webhook via a bundle variable — the typical setup for teams
# that want a single source-of-truth for the destination ID across many
# repos. The patcher detects the variable reference and SKIPS the event
# list with a WARNING, because it can't resolve `${var.*}` and if the
# variable resolves to the same destination at deploy, Databricks would
# reject the deploy with `cannot update job: Duplicate webhook ids ...`.
# Hand-edit if you intentionally want the patcher to layer additional
# literal destinations alongside the variable.
resources:
  jobs:
    reporting_job:
      name: reporting
      tags:
        team: analytics
      webhook_notifications:
        on_failure:
          - id: ${var.webhook_id}
        on_duration_warning_threshold_exceeded:
          - id: ${var.webhook_id}
      tasks:
        - task_key: build_report
          notebook_task:
            notebook_path: ../notebooks/common.py
