# ETL job resources. Demonstrates shared tag conventions via YAML anchor/alias.
resources:
  jobs:
    nightly_etl:
      name: nightly-etl
      tags: &etl_tags
        team: data-platform
        cohort: webhook-rollout-1
      tasks:
        - task_key: extract
          notebook_task:
            notebook_path: ../../notebooks/common.py
        - task_key: transform
          depends_on:
            - task_key: extract
          notebook_task:
            notebook_path: ../../notebooks/common.py

    hourly_etl:
      name: hourly-etl
      # Reuse the etl_tags anchor — patcher must preserve the alias on round-trip.
      tags: *etl_tags
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
      tasks:
        - task_key: incremental
          notebook_task:
            notebook_path: ../../notebooks/common.py
