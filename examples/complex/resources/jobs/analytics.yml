# Analytics job — partially wired with webhook_notifications, so the
# patcher exercises both its variable-aware-skip path and its
# normal-create path on the same job (with the default
# --events on_failure,on_duration_warning_threshold_exceeded):
#   - on_failure has a fixed literal AND a ${var.webhook_id} entry.
#     The patcher SKIPS this event list (variable ref present; would
#     risk a deploy-time duplicate if the variable resolves to the
#     literal --webhook-id). Logs a WARNING.
#   - on_duration_warning_threshold_exceeded does not exist yet. The
#     patcher creates it and inserts the supplied --webhook-id.
resources:
  jobs:
    analytics_job:
      name: analytics
      tags:
        team: analytics
      webhook_notifications:
        on_failure:
          # Existing dedicated alert channel; must survive the merge.
          - id: "11111111-2222-3333-4444-555555555555"
          # Variable reference — patcher treats this as opaque and skips
          # the whole event list with a WARNING.
          - id: ${var.webhook_id}
      tasks:
        - task_key: run_report
          notebook_task:
            notebook_path: ../../notebooks/common.py
